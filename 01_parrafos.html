<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parrafos y Encabezados</title>
</head>
<body>
     <!-- Titulos o encabezados:
     Se tiene 6 tipos de encabezados, desde el h1 hasta el h6. -->
     <!-- (h$*6) Crea 6 titulos en orden del 1 al 6 Emmet -->
    <h1>Titulo</h1>
    <!-- El h1 se utiliza una sola vez en una página web  esto es debido a que el h1 tiene una impotancia en el CEO lo que es el posicionamiento Web, es decir,google le da mucha inportancia al h1 -->
    <h2>Subtitulo</h2>
    <h3>subtitulo</h3>
    <h4>subtitulo</h4>
    <h5>subtitulo</h5>
    <h6>subtitulo</h6>
    <!-- Desde el h2 hasta el h6 se puede utilizar las veces que sean necesarias segun el contenido que se quiera recrear   -->

    <!-- Parrafo: Los parrafos deben tener una idea o punto especifico.
     Cada parrafo escrito debe de contener un concepto, una idea. Es decir, puede describir una seccion o un elemento, hasta un mensaje en el chat. Por ejmeplo en una sección se habla sobre los beneficios del ejercicio:
     Un parrafo puede tratar de mejorar la salud cardiovascular y otro puede ser sobre los beneficios y cuidado de la salud mental. Finalmente,debe existir de un motivo para que exista una parrafo.-->
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit, animi nemo odio sint id enim quasi quod velit doloribus nostrum officiis qui deserunt porro molestias eius delectus, possimus, fugiat fuga.
    </p>
    <!-- (CTRL+SHIFT+P) o (ALT+Z) Ajusta el contenido del parrafo a la ventana del editor -->
    <!-- EXiste algunas tecnologias de asitencia como lectores de pantalla, que ayudan a las personas con diacapacidad visual a navegar por el contenido web.
     Por ejemplo: cuando estas tecnologias leen el h1 de la pagina, entienden de que trata la pagina por el h1. por temas de accesibilidad web es importante que se utilice solo un h1 por pagina.  --> 
</body>
</html>
