    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
    <!-- https://techicons.dev/icons/react -->
</head>
<body>
    <!--Etiqueta de bloque y etiquetas de linea  -->
    <h1>Imagenes</h1>
    <!-- Las imagenes se insetan en HTML utilizando la etiqueta img. esta etiqueta es un elemento vacio, lo que significa que no tiene una etiqueta de cierre. la sintaxis basica para insertar una imagen es  -->

    <!-- vale la pena recordar que el atributo title proporciona un tooltip que se muestra cuando el usuario coloca el cursor sobre la imagen -->
     <img src="04_imagen.png" alt="logotipo de HTML5" title="HTML5" width="200" height="200">
</body>
